# Render Blueprint — deploys the app as a Docker web service with a
# persistent disk for the SQLite database.
# Create via Render Dashboard → New → Blueprint, pointed at this repo.
# Note: a persistent disk requires a paid instance type (the free tier has none).
services:
  - type: web
    name: gokul-gruh-admin
    runtime: docker
    plan: starter
    region: singapore            # closest Render region to India; change if you prefer
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    autoDeploy: true
    disk:
      name: ggu-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # SQLite file lives on the mounted persistent disk so data survives deploys.
      - key: DATABASE_URL
        value: file:/var/data/prod.db
      # Strong random session secret, generated once by Render.
      - key: AUTH_SECRET
        generateValue: true
      # First-run admin account (used only if no admin exists yet).
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false
